suite: demo
cases:
  - name: calls weather tool and answers
    cassette: ./cassette.example.jsonl
    assertions:
      - kind: tool.called
        name: get_weather
      - kind: answer.contains
        text: sunny
      - kind: budget.maxTokens
        value: 500
      - kind: budget.maxSteps
        value: 3
  - name: never runs dangerous tools
    cassette: ./cassette.example.jsonl
    assertions:
      - kind: forbid.tool
        name: execute_shell
      - kind: tool.order
        names:
          - get_weather
