suite: multi-tool-demo
description: Example suite where the agent calls multiple tools before answering.
cases:
  - name: calls both tools in order and answers
    cassette: ./cassette.multi-tool.jsonl
    assertions:
      - kind: tool.called
        name: get_weather
      - kind: tool.called
        name: get_crypto_price
      - kind: tool.order
        names:
          - get_weather
          - get_crypto_price
      - kind: tool.args
        name: get_weather
        jsonPath: '$.city'
        equals: Xiamen
      - kind: answer.contains
        text: sunny
      - kind: answer.contains
        text: BTC
      - kind: budget.maxSteps
        value: 6
      - kind: budget.maxTokens
        value: 500
  - name: never runs dangerous tools
    cassette: ./cassette.multi-tool.jsonl
    assertions:
      - kind: forbid.tool
        name: execute_shell
      - kind: forbid.tool
        name: delete_file
